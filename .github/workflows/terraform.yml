name: Terraform CI-CD

on:
  pull_request:
    branches:
      - main

  push:
    branches:
      - main

permissions:
  id-token: write
  contents: read
  pull-requests: write

env:
  TF_WORKING_DIR: environment/dev

jobs:

  # ==================================================
  # SECURITY AGENT
  # ==================================================

  security:
    name: Security Agent
    runs-on: ubuntu-latest

    steps:

      # 1. Checkout source code
      - name: Checkout Code
        uses: actions/checkout@v4

      # 2. Gitleaks - Secret Detection
      - name: Gitleaks Scan
        uses: gitleaks/gitleaks-action@v2

      # 3. Setup TFLint
      - name: Setup TFLint
        uses: terraform-linters/setup-tflint@v4

      # 4. Run TFLint
      - name: TFLint Scan
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: |
          tflint --init
          tflint

      # 5. Checkov - Terraform Security Scan
      - name: Checkov Scan
        uses: bridgecrewio/checkov-action@v12
        with:
          directory: ${{ env.TF_WORKING_DIR }}


  # ==================================================
  # PR REVIEW AGENT
  # ==================================================

  pr-review:
    name: PR Review Agent
    if: github.event_name == 'pull_request'
    needs: security
    runs-on: ubuntu-latest

    steps:

      # 1. Checkout source code
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 2. Terraform Format Review
      - name: Terraform Format Review
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: |
          terraform fmt -check -recursive

      # 3. Review Terraform Changes
      - name: Review Terraform Changes
        run: |
          echo "======================================"
          echo "PR REVIEW AGENT"
          echo "======================================"
          echo "Reviewing Terraform changes..."
          echo "Security checks completed successfully."
          echo "Terraform formatting is valid."
          echo "PR is ready for Terraform validation."


  # ==================================================
  # TERRAFORM AGENT
  # ==================================================

  terraform:
    name: Terraform Agent
    needs: security
    runs-on: ubuntu-latest

    steps:

      # 1. Checkout source code
      - name: Checkout Code
        uses: actions/checkout@v4

      # 2. Azure Login using OIDC
      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: "24623e13-3c30-4d95-bd03-1320e53394d9"
          tenant-id: "e8e1bab7-6578-4fda-8bc7-b6a7746c93f7"
          subscription-id: "87517155-e28d-4d9b-b1ee-f212445262ff"

      # 3. Setup Terraform
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      # 4. Terraform Format Check
      - name: Terraform Format
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: |
          terraform fmt -check -recursive

      # 5. Terraform Init
      - name: Terraform Init
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: |
          terraform init

      # 6. Terraform Validate
      - name: Terraform Validate
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: |
          terraform validate

      # 7. Terraform Plan
      - name: Terraform Plan
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: |
          terraform plan -out=tfplan

      # 8. Terraform Apply
      - name: Terraform Apply
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: |
          terraform apply -auto-approve tfplan


  # ==================================================
  # POST DEPLOYMENT VALIDATION AGENT
  # ==================================================

  post-deployment-validation:
    name: Post Deployment Validation Agent
    needs: terraform
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:

      # 1. Checkout source code
      - name: Checkout Code
        uses: actions/checkout@v4

      # 2. Azure Login using OIDC
      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: "24623e13-3c30-4d95-bd03-1320e53394d9"
          tenant-id: "e8e1bab7-6578-4fda-8bc7-b6a7746c93f7"
          subscription-id: "87517155-e28d-4d9b-b1ee-f212445262ff"

      # 3. Validate Resource Groups
      - name: Validate Resource Groups
        run: |
          echo "======================================"
          echo "Checking Resource Groups"
          echo "======================================"

          az group show --name rg1
          az group show --name rg2

      # 4. Validate VNet
      - name: Validate VNet
        run: |
          echo "======================================"
          echo "Checking VNet"
          echo "======================================"

          az network vnet show \
            --resource-group rg1 \
            --name vnet1

      # 5. Validate Subnets
      - name: Validate Subnets
        run: |
          echo "======================================"
          echo "Checking Subnets"
          echo "======================================"

          az network vnet subnet show \
            --resource-group rg1 \
            --vnet-name vnet1 \
            --name frontend_snet

          az network vnet subnet show \
            --resource-group rg1 \
            --vnet-name vnet1 \
            --name backend_snet

      # 6. Validate Virtual Machines
      - name: Validate Virtual Machines
        run: |
          echo "======================================"
          echo "Checking Virtual Machines"
          echo "======================================"

          VM_COUNT=$(az vm list \
            --resource-group rg1 \
            --query "length(@)" \
            -o tsv)

          echo "VM count: $VM_COUNT"

          if [ "$VM_COUNT" -eq 0 ]; then
            echo "ERROR: No Virtual Machines found in rg1"
            exit 1
          fi

          az vm list \
            --resource-group rg1 \
            --show-details \
            --query "[].{Name:name,PowerState:powerState}" \
            -o table

      # 7. Validate Public IPs
      - name: Validate Public IPs
        run: |
          echo "======================================"
          echo "Checking Public IPs"
          echo "======================================"

          az network public-ip list \
            --resource-group rg1 \
            --query "[].{Name:name,IP:ipAddress,Allocation:publicIPAllocationMethod}" \
            -o table

      # 8. Validation Summary
      - name: Validation Summary
        run: |
          echo "======================================"
          echo "POST DEPLOYMENT VALIDATION"
          echo "======================================"
          echo "All required Azure resources validated successfully."


  # ==================================================
  # RCA AGENT
  # ==================================================

  rca:
    name: RCA Agent
    needs:
      - terraform
      - post-deployment-validation

    if: |
      always() &&
      (needs.terraform.result == 'failure' ||
       needs.post-deployment-validation.result == 'failure')

    runs-on: ubuntu-latest

    steps:

      # 1. Checkout source code
      - name: Checkout Code
        uses: actions/checkout@v4

      # 2. Azure Login using OIDC
      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: "24623e13-3c30-4d95-bd03-1320e53394d9"
          tenant-id: "e8e1bab7-6578-4fda-8bc7-b6a7746c93f7"
          subscription-id: "87517155-e28d-4d9b-b1ee-f212445262ff"

      # 3. Collect Deployment Diagnostics
      - name: Collect Deployment Diagnostics
        run: |
          echo "======================================"
          echo "RCA AGENT"
          echo "======================================"

          echo "Terraform Job Result:"
          echo "${{ needs.terraform.result }}"

          echo "Post Deployment Validation Result:"
          echo "${{ needs.post-deployment-validation.result }}"

          echo "======================================"
          echo "Azure Resource Groups"
          echo "======================================"

          az group list \
            --query "[].{Name:name,Location:location,State:properties.provisioningState}" \
            -o table

          echo "======================================"
          echo "Virtual Machines"
          echo "======================================"

          az vm list \
            --show-details \
            --query "[].{ResourceGroup:resourceGroup,Name:name,PowerState:powerState}" \
            -o table

          echo "======================================"
          echo "RCA Agent completed diagnostic collection."
          echo "Check failed job logs for detailed Terraform errors."